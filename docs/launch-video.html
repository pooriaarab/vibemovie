<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vibemovie — launch</title>
<!--
  THESIS: a ~20s cinematic launch trailer. The coding session is framed as a film
  worth watching, then the product resolves out of the build.
  OWN-WORLD: near-black theater stock (#0a0908) + warm gold accent (#d9a94e),
  committed vibemovie palette (moss/rust/dusk secondaries). Serif is the emotional
  voice (title cards, wordmark, tagline); monospace carries only fact — data,
  timecodes, and the real install command. 2.35:1 letterbox bars stay pure black;
  grain, vignette and iris live inside the film plane.
  MOTION: one authored arc — blur-in title cards → hard-cut montage punches →
  iris breath (the rising "coming soon" tension) → iris-open product reveal with a
  single gold light-sweep. No strobe (one warm flash only), autoplay + seamless loop.
  SELF-CONTAINED: system fonts only, inline CSS/JS/SVG, zero network.
-->
<style>
  :root{
    --bg:        #0a0908;
    --frame:     #050403;
    --ink:       #f2ede1;
    --ink-soft:  #908674;   /* >=4.5:1 on black, for small secondary text */
    --ink-dim:   #a89e8c;
    --gold:      #d9a94e;
    --gold-dim:  #8a6a2f;
    --add:       #7fae8a;
    --remove:    #b25a45;
    --merge:     #a084d6;
    --ease:      cubic-bezier(0.16, 1, 0.3, 1);
    --serif:     ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
    --mono:      ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans:      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;                 /* pure black letterbox surround */
    overflow: hidden;
  }
  body{ font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  /* ---------- film plane (2.35:1, letterboxed) ---------- */
  .stage{
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    aspect-ratio: 2.35 / 1;
    width: min(100vw, calc(100vh * 2.35));
    container-type: inline-size;      /* cqw scales type to the frame, not the viewport */
    background: var(--bg);
    overflow: hidden;
  }

  /* hairline edge so the film plane reads against the bars */
  .frame{
    position: absolute; inset: 0; pointer-events: none; z-index: 9;
    box-shadow:
      inset 0 0 0 1px rgba(217,169,78,0.05),
      inset 0 0 120px 10px rgba(0,0,0,0.55);
  }

  /* ---------- analog texture ---------- */
  .grain{
    position: absolute; inset: -60%;          /* oversized so jitter reveals fresh noise */
    pointer-events: none; z-index: 8;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 180px 180px;
    opacity: .08;
    mix-blend-mode: overlay;
    will-change: transform;
  }
  @media (prefers-reduced-motion: no-preference){
    .grain{ animation: grain-shift .7s steps(5) infinite; }
  }
  @keyframes grain-shift{
    0%   { transform: translate(0, 0); }
    20%  { transform: translate(-3%, 2%); }
    40%  { transform: translate(2%, -3%); }
    60%  { transform: translate(-2%, -2%); }
    80%  { transform: translate(3%, 1%); }
    100% { transform: translate(0, 0); }
  }

  .vignette{
    position: absolute; inset: 0; pointer-events: none; z-index: 7;
    background: radial-gradient(125% 100% at 50% 50%, transparent 52%, rgba(0,0,0,0.5) 100%);
  }

  /* iris closes during the "breath" and opens on the product reveal */
  .iris{
    position: absolute; inset: 0; pointer-events: none; z-index: 10;
    background: radial-gradient(58% 58% at 50% 50%, transparent 0%, rgba(0,0,0,0.65) 55%, #000 78%);
    opacity: 0;
  }

  /* single warm flash into the montage */
  .flash{
    position: absolute; inset: 0; pointer-events: none; z-index: 11;
    background: #f2ede1;
    opacity: 0;
  }

  /* ---------- layers ---------- */
  .layer{
    position: absolute; inset: 0; z-index: 6;
    display: none;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 0 9%;
  }
  .layer.is-on{ display: flex; }

  /* ---------- title cards (serif voice) ---------- */
  .card{
    display: none;
    flex-direction: column; align-items: center;
    will-change: transform, opacity, filter;
  }
  .card.is-on{ display: flex; }
  .card .kicker{
    font-family: var(--serif);
    font-style: italic;
    font-size: 2.4cqw;
    color: var(--gold);
    letter-spacing: 0.02em;
    margin-bottom: 1.2cqw;
    opacity: 0;                          /* driven by JS */
  }
  .card .line{
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(1.6rem, 7cqw, 7rem);
    line-height: 1.04;
    letter-spacing: -0.02em;
    color: var(--ink);
    max-width: 22ch;
  }
  .card .line em{ font-style: italic; color: var(--gold); }

  /* ---------- montage (hard-cut trailer beats) ---------- */
  .montage{
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 1.4cqw;
    will-change: transform, opacity;
  }
  .montage.is-on{ display: flex; }
  .m-voice{                      /* serif emotional label */
    font-family: var(--serif);
    font-style: italic;
    font-size: 3.4cqw;
    color: var(--ink-dim);
    letter-spacing: -0.01em;
  }
  .m-fact{                       /* mono data: the truth of the moment */
    font-family: var(--mono);
    font-weight: 600;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .m-fact.big{ font-size: 11cqw; }
  .m-fact.med{ font-size: 6.4cqw; }
  .m-fact .plus{ color: var(--add); }
  .m-fact .minus{ color: var(--remove); }
  .m-fact .hash{ color: var(--ink-dim); }

  .m-bar{
    width: 44cqw; max-width: 70%;
    height: 1.6cqw; min-height: 8px;
    border-radius: 999px; overflow: hidden; display: flex;
    background: #1a140d;
    border: 1px solid #241d14;
  }
  .m-bar .add{ background: var(--add); height: 100%; width: 0%; }
  .m-bar .remove{ background: var(--remove); height: 100%; width: 0%; }

  .m-checks{ display: flex; gap: 2.2cqw; }
  .m-checks svg{ width: 3.6cqw; height: 3.6cqw; }

  .m-glyph{ width: 7cqw; height: 7cqw; color: var(--merge); transform-origin: center; }
  .m-confetti{ position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  .m-confetti i{
    position: absolute; top: -8%;
    width: .8cqw; height: 1.6cqw; min-width: 5px; min-height: 9px;
    border-radius: 2px; opacity: 0;
  }
  .m-confetti.is-fire i{ animation: confetti-fall 1s ease-in forwards; }
  @keyframes confetti-fall{
    0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(60cqw) rotate(320deg); }
  }

  .m-term{
    font-family: var(--mono);
    font-size: 4.6cqw;
    color: var(--ink-dim);
    letter-spacing: -0.01em;
  }
  .m-term .ok{ color: var(--add); }
  .m-term .prompt{ color: var(--gold); }
  .cursor{
    display: inline-block; width: .5ch; height: 1em;
    background: var(--gold); vertical-align: -.12em; margin-left: .15ch;
  }
  @media (prefers-reduced-motion: no-preference){
    .cursor{ animation: blink 1s steps(1) infinite; }
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  /* ---------- end card (the product) ---------- */
  .end{
    flex-direction: column; align-items: center;
    gap: 0;
  }
  .mark-wrap{ position: relative; }
  .wordmark{
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2.2rem, 13cqw, 13rem);
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--ink);
    will-change: transform, opacity, filter;
  }
  .wordmark em{ font-style: italic; color: var(--gold); }
  /* the single gold light-sweep across the wordmark */
  .shimmer{
    position: absolute; inset: 0; pointer-events: none;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(#000, #000);
            mask-image: linear-gradient(#000, #000);
    opacity: 0;
  }
  .shimmer::after{
    content: "";
    position: absolute; top: 0; bottom: 0; left: -40%; width: 30%;
    background: linear-gradient(100deg,
      transparent 0%,
      rgba(255,236,196,0.0) 35%,
      rgba(255,236,196,0.55) 50%,
      rgba(255,236,196,0.0) 65%,
      transparent 100%);
    transform: translateX(-30%) skewX(-14deg);
    filter: blur(1px);
  }
  .shimmer.is-fire::after{ animation: sweep 1.15s var(--ease) forwards; }
  @keyframes sweep{
    0%   { transform: translateX(-30%) skewX(-14deg); }
    100% { transform: translateX(420%) skewX(-14deg); }
  }

  .tagline{
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(1rem, 3.4cqw, 3.4rem);
    color: var(--ink-soft);
    letter-spacing: 0.01em;
    margin-top: 2.2cqw;
    will-change: opacity, transform;
  }

  .install{
    margin-top: 4cqw;
    display: inline-flex; align-items: center; gap: 1ch;
    font-family: var(--mono);
    font-size: clamp(.8rem, 2.35cqw, 2.35rem);
    color: var(--ink);
    background: rgba(20,18,14,0.72);
    border: 1px solid #2c2417;
    border-radius: 999px;
    padding: 1.3cqw 2.6cqw;
    white-space: nowrap;
    box-shadow: 0 10px 30px -16px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.03);
    will-change: opacity, transform;
  }
  .install .prompt{ color: var(--gold); }
  .install .pkg{ color: var(--ink-dim); }

  .suite{
    margin-top: 3.4cqw;
    font-family: var(--sans);
    font-size: clamp(.66rem, 1.5cqw, 1.5rem);
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    will-change: opacity;
  }
  .suite .sep{ color: var(--gold-dim); margin: 0 .6ch; }

  /* ---------- reduced motion: neutralise the aggressive beats ---------- */
  @media (prefers-reduced-motion: reduce){
    .grain{ animation: none; opacity: .05; }
    .cursor, .m-confetti.is-fire i{ animation: none; }
    .shimmer.is-fire::after{ animation: none; opacity: 0; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="frame"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="iris" id="iris"></div>
  <div class="flash" id="flash"></div>

  <!-- LAYER: title cards -->
  <div class="layer" id="layerCards">
    <div class="card" data-card="0">
      <div class="kicker">a film by your terminal</div>
      <div class="line">Every coding session&hellip;</div>
    </div>
    <div class="card" data-card="1">
      <div class="kicker">roll the recap</div>
      <div class="line">&hellip;is a <em>story</em> worth watching.</div>
    </div>
  </div>

  <!-- LAYER: montage -->
  <div class="layer" id="layerMontage">
    <div class="montage" data-slide="0">
      <div class="m-fact big" id="mTasksNum">3</div>
      <div class="m-voice">tasks done</div>
      <div class="m-checks" id="mChecks"></div>
    </div>

    <div class="montage" data-slide="1">
      <div class="m-voice">lines moved</div>
      <div class="m-bar"><span class="add" id="mBarAdd"></span><span class="remove" id="mBarRemove"></span></div>
      <div class="m-fact med"><span class="plus">+340</span>&nbsp;&nbsp;<span class="minus">&minus;88</span></div>
    </div>

    <div class="montage" data-slide="2">
      <div class="m-term"><span class="prompt">$</span> test <span class="ok">42 passed</span><span class="cursor"></span></div>
      <div class="m-voice">all green</div>
    </div>

    <div class="montage" data-slide="3" style="position:relative;">
      <svg class="m-glyph" id="mGlyph" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
        <circle cx="14" cy="12" r="4"/>
        <circle cx="14" cy="36" r="4"/>
        <circle cx="34" cy="12" r="4"/>
        <path d="M14 16v12a8 8 0 0 0 8 8h4"/>
        <path d="M34 16v4"/>
      </svg>
      <div class="m-fact big"><span class="hash">#</span>42</div>
      <div class="m-voice">merged into main</div>
      <div class="m-confetti" id="mConfetti"></div>
    </div>
  </div>

  <!-- LAYER: end card -->
  <div class="layer end" id="layerEnd">
    <div class="mark-wrap" id="markWrap">
      <div class="wordmark" id="wordmark">vibe<em>movie</em></div>
      <div class="shimmer" id="shimmer"></div>
    </div>
    <div class="tagline" id="tagline">your session, as a movie</div>
    <div class="install" id="install">
      <span class="prompt">$</span><span>npx</span>&nbsp;<span class="pkg">@pooriaarab/vibemovie</span>&nbsp;<span>render session.json</span>
    </div>
    <div class="suite" id="suite">part of the Vibe Suite<span class="sep">◆</span>local-first</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- timeline (~19.9s, seamless loop) ---------------- */
  var BEATS = [
    { id:"open",    group:"none",    dur: 600  },   // cold open — black, grain settles
    { id:"cardA",   group:"cards",   dur: 3000, card: 0 },
    { id:"cardB",   group:"cards",   dur: 3200, card: 1 },
    { id:"flash",   group:"none",    dur: 200, flash: true },  // single warm flash into montage
    { id:"mTasks",  group:"montage", dur: 560, slide: 0 },
    { id:"mDiff",   group:"montage", dur: 500, slide: 1 },
    { id:"mTests",  group:"montage", dur: 480, slide: 2 },
    { id:"mPr",     group:"montage", dur: 640, slide: 3 },
    { id:"breath",  group:"none",    dur: 700  },   // iris closes — rising tension
    { id:"end",     group:"end",     dur: 9600 },   // iris opens — the product
    { id:"out",     group:"none",    dur: 400  }    // tail to black → loops to open
  ];

  var offsets = [], acc = 0;
  BEATS.forEach(function(b){ offsets.push(acc); acc += b.dur; });
  var TOTAL = acc;

  /* ---------------- refs ---------------- */
  var stage       = document.getElementById("stage");
  var irisEl      = document.getElementById("iris");
  var flashEl     = document.getElementById("flash");
  var layerCards  = document.getElementById("layerCards");
  var layerMont   = document.getElementById("layerMontage");
  var layerEnd    = document.getElementById("layerEnd");
  var cards       = layerCards.querySelectorAll(".card");
  var slides      = layerMont.querySelectorAll(".montage");
  var wordmark    = document.getElementById("wordmark");
  var markWrap    = document.getElementById("markWrap");
  var shimmer     = document.getElementById("shimmer");
  var tagline     = document.getElementById("tagline");
  var install     = document.getElementById("install");
  var suite       = document.getElementById("suite");
  var mChecks     = document.getElementById("mChecks");
  var mBarAdd     = document.getElementById("mBarAdd");
  var mBarRemove  = document.getElementById("mBarRemove");
  var mGlyph      = document.getElementById("mGlyph");
  var mConfetti   = document.getElementById("mConfetti");

  /* build check marks (draw-in stroke) + confetti once */
  var checkSVG = '<svg viewBox="0 0 20 20" fill="none">'
    + '<circle cx="10" cy="10" r="9" stroke="#3a3024" stroke-width="1.4"/>'
    + '<path d="M5.5 10.2l3 3 6-6.4" stroke="' + '#7fae8a'
    + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>';
  mChecks.innerHTML = checkSVG + checkSVG + checkSVG;
  var checkPaths = mChecks.querySelectorAll("path");

  var confettiColors = ["var(--gold)", "var(--add)", "var(--remove)", "var(--merge)"];
  (function buildConfetti(){
    var frag = "";
    for (var i = 0; i < 12; i++){
      var left = 12 + Math.random() * 76;
      var c = confettiColors[i % confettiColors.length];
      var d = (Math.random() * 0.25).toFixed(2);
      frag += '<i style="left:' + left + '%;background:' + c + ';animation-delay:' + d + 's;"></i>';
    }
    mConfetti.innerHTML = frag;
  })();

  /* ---------------- math ---------------- */
  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
  function easeOutExpo(x){ return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); }
  function easeInExpo(x){ return x <= 0 ? 0 : Math.pow(2, 10 * x - 10); }
  function easeOutBack(x){
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  function beatAt(time){
    for (var i = BEATS.length - 1; i >= 0; i--){
      if (time >= offsets[i]) return i;
    }
    return 0;
  }

  function setLayer(group){
    layerCards.classList.toggle("is-on", group === "cards");
    layerMont.classList.toggle("is-on", group === "montage");
    layerEnd.classList.toggle("is-on", group === "end");
  }

  /* ---------------- per-beat renderers ---------------- */
  function renderCard(i, local, dur){
    var card = cards[i];
    cards.forEach(function(c, idx){ c.classList.toggle("is-on", idx === i); });
    var inWin = 820, outWin = 880;
    var line = card.querySelector(".line");
    var kicker = card.querySelector(".kicker");
    var opacity = 1, blur = 0, ty = 0, scale = 1, kOp = 1;

    if (local < inWin){
      var p = easeOutExpo(local / inWin);
      opacity = p; blur = (1 - p) * 20; ty = (1 - p) * 14; scale = 0.985 + 0.015 * p;
      kOp = easeOutExpo(clamp((local - 420) / 520, 0, 1));
    } else if (local > dur - outWin){
      var q = easeInExpo((local - (dur - outWin)) / outWin);
      opacity = 1 - q; blur = q * 16; ty = -q * 10; scale = 1 - 0.012 * q;
      kOp = clamp(1 - q * 1.3, 0, 1);
    }
    if (reduceMotion){ blur = 0; ty = 0; scale = 1; }
    line.style.opacity = opacity;
    line.style.filter = blur > 0.1 ? "blur(" + blur.toFixed(2) + "px)" : "none";
    line.style.transform = "translateY(" + ty.toFixed(2) + "px) scale(" + scale.toFixed(4) + ")";
    kicker.style.opacity = kOp;
  }

  function renderMontage(i, local, dur, justEntered){
    slides.forEach(function(s, idx){ s.classList.toggle("is-on", idx === i); });
    // hard-cut entrance: near-instant opacity + a quick scale punch
    var inWin = reduceMotion ? 1 : 90;
    var pop = reduceMotion ? 1 : easeOutExpo(clamp(local / 240, 0, 1));
    var op = clamp(local / inWin, 0, 1);
    var scale = 1.16 - 0.16 * pop;
    slides[i].style.opacity = op;
    slides[i].style.transform = "scale(" + scale.toFixed(4) + ")";

    // per-slide internal life
    if (i === 0){            // tasks: checks draw in, staggered
      checkPaths.forEach(function(pth, k){
        var start = 70 + k * 80;
        var p = easeOutExpo(clamp((local - start) / 200, 0, 1));
        pth.setAttribute("stroke-dashoffset", String(1 - p));
      });
    } else if (i === 1){     // diff: bars slam
      var pAdd = easeOutExpo(clamp(local / 280, 0, 1));
      var pRem = easeOutExpo(clamp((local - 200) / 240, 0, 1));
      mBarAdd.style.width = (pAdd * (340 / 428) * 100) + "%";
      mBarRemove.style.width = (pRem * (88 / 428) * 100) + "%";
    } else if (i === 3){     // pr: glyph pop + confetti
      var g = easeOutBack(clamp(local / 360, 0, 1));
      mGlyph.style.transform = "scale(" + Math.max(0, g).toFixed(3) + ")";
      if (justEntered && !reduceMotion){
        mConfetti.classList.remove("is-fire");
        void mConfetti.offsetWidth;
        mConfetti.classList.add("is-fire");
      }
    }
  }

  function renderEnd(local, dur, justEntered){
    // sub-timeline for the layered reveal
    var wmP  = easeOutExpo(clamp(local / 900, 0, 1));
    var tgP  = easeOutExpo(clamp((local - 820) / 720, 0, 1));
    var inP  = easeOutExpo(clamp((local - 1700) / 760, 0, 1));
    var suP  = easeOutExpo(clamp((local - 2650) / 620, 0, 1));
    // tail fade-out so the loop lands on black
    var outQ = easeInExpo(clamp((local - (dur - 520)) / 520, 0, 1));

    function tail(op){ return clamp(op * (1 - outQ), 0, 1); }

    if (reduceMotion){
      wmP = 1; tgP = 1; inP = 1; suP = 1;
    }
    var wmBlur = reduceMotion ? 0 : (1 - wmP) * 18;
    wordmark.style.opacity = tail(wmP);
    wordmark.style.filter = wmBlur > 0.1 ? "blur(" + wmBlur.toFixed(2) + "px)" : "none";
    wordmark.style.transform = "translateY(" + ((1 - wmP) * 16).toFixed(2) + "px) scale(" + (0.985 + 0.015 * wmP).toFixed(4) + ")";

    tagline.style.opacity = tail(tgP);
    tagline.style.transform = "translateY(" + ((1 - tgP) * 10).toFixed(2) + "px)";

    install.style.opacity = tail(inP);
    install.style.transform = "translateY(" + ((1 - inP) * 12).toFixed(2) + "px)";

    suite.style.opacity = tail(suP);

    if (justEntered && !reduceMotion){
      shimmer.classList.remove("is-fire");
      void shimmer.offsetWidth;
      // fire the sweep right as the wordmark finishes settling
      setTimeout(function(){ shimmer.classList.add("is-fire"); }, 520);
    }
  }

  function renderFlash(beat, local){
    if (!beat.flash){ flashEl.style.opacity = 0; return; }
    if (reduceMotion){ flashEl.style.opacity = 0; return; }
    // single warm pulse: up by 60ms, down by 180ms
    var op;
    if (local < 60) op = (local / 60) * 0.5;
    else op = (1 - (local - 60) / 120) * 0.5;
    flashEl.style.opacity = clamp(op, 0, 0.5);
  }

  function renderIris(idx, local){
    var beat = BEATS[idx], op = 0;
    if (beat.id === "breath"){
      op = easeInExpo(clamp(local / beat.dur, 0, 1));        // close
    } else if (beat.id === "end"){
      op = 1 - easeOutExpo(clamp(local / 240, 0, 1));        // open
    }
    irisEl.style.opacity = reduceMotion ? 0 : op;
  }

  /* ---------------- main loop ---------------- */
  var t = 0, last = null, lastIdx = -1;

  function render(){
    var idx = beatAt(t);
    var beat = BEATS[idx];
    var local = t - offsets[idx];
    var justEntered = idx !== lastIdx;

    setLayer(beat.group);

    if (beat.group === "cards")        renderCard(beat.card, local, beat.dur);
    else if (beat.group === "montage") renderMontage(beat.slide, local, beat.dur, justEntered);
    else if (beat.group === "end")     renderEnd(local, beat.dur, justEntered);

    renderFlash(beat, local);
    renderIris(idx, local);

    lastIdx = idx;
  }

  function loop(ts){
    if (last === null) last = ts;
    var dt = ts - last;
    last = ts;
    t += dt;
    if (t >= TOTAL) t -= TOTAL;     // seamless loop (black → black)
    render();
    requestAnimationFrame(loop);
  }

  // hide all layers initially, then start
  setLayer("none");
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
